name: Build DDclash APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Core Submodule & Mihomo
        run: |
          rm -rf core/src/foss/golang/clash
          mkdir -p core/src/foss/golang
          
          # Clone repository Mihomo MetaCubeX
          git clone --depth=50 https://github.com/MetaCubeX/mihomo.git core/src/foss/golang/clash
          cd core/src/foss/golang/clash
          git checkout tags/v1.7.0 2>/dev/null || git checkout Alpha 2>/dev/null || git checkout main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Pre-fetch Go Modules
        run: |
          cd "$GITHUB_WORKSPACE/core/src/foss/golang/clash"
          go mod download || true
          
          cd "$GITHUB_WORKSPACE/core/src/foss/golang"
          go mod download || true

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          if [ -d "$GITHUB_WORKSPACE/.github/patch" ]; then
            for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do 
              [ -f "$p" ] && patch --verbose -p 1 < "$p" || true
            done
          fi

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          mkdir -p core/src/foss/golang/clash/component/ca
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew --no-daemon app:assembleAlphaRelease --stacktrace

      - name: Upload DDclash APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DDclash-Release-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
