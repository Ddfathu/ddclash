name: Build DDclash APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Inject Core Dependencies & Geo Assets
        run: |
          # 1. Pastikan folder submodule core terisi
          mkdir -p core/src/main/golang
          if [ ! -f "core/src/main/golang/clash/go.mod" ]; then
            echo "[*] Cloning Mihomo Core..."
            rm -rf core/src/main/golang/clash
            git clone --depth=1 -b main https://github.com/MetaCubeX/mihomo.git core/src/main/golang/clash
          fi

          # 2. Unduh Geo Database agar verifikasi resource common tidak FAILED
          mkdir -p core/src/main/assets
          curl -s -L -o core/src/main/assets/geoip.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat || true
          curl -s -L -o core/src/main/assets/geosite.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK (Release Flavor Meta)
        run: ./gradlew assembleMetaRelease --stacktrace

      - name: Upload DDclash APK
        uses: actions/upload-artifact@v4
        with:
          name: DDclash-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
