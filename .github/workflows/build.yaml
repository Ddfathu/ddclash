name: Build DDclash APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Core Submodule & Mihomo
        run: |
          git submodule update --init --recursive --force || true
          mkdir -p core/src/foss/golang
          if [ ! -f "core/src/foss/golang/clash/go.mod" ]; then
            echo "[*] Cloning Mihomo Core into core/src/foss/golang/clash..."
            rm -rf core/src/foss/golang/clash
            git clone --depth=1 -b main https://github.com/MetaCubeX/mihomo.git core/src/foss/golang/clash
          fi
          # Buat symlink jaga-jaga bila dicari di path main
          mkdir -p core/src/main/golang
          ln -sfn ../foss/golang/clash core/src/main/golang/clash 2>/dev/null || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          if [ -d "$GITHUB_WORKSPACE/.github/patch" ]; then
            for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do 
              [ -f "$p" ] && patch --verbose -p 1 < "$p" || true
            done
          fi

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          mkdir -p core/src/foss/golang/clash/component/ca
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt || true

      - name: Build APK
        run: ./gradlew --no-daemon app:assembleAlphaRelease --stacktrace

      - name: Upload DDclash APK (Semua Arsitektur)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DDclash-Release-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
